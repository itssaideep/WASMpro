; ============================================
; SecureWasm Edge — ESP8266 PlatformIO Config
; ============================================
; Board:  NodeMCU v2 (ESP-12E module)
; MCU:    ESP8266 (Xtensa LX106)
; Flash:  4 MB
; SRAM:   80 KB
; Clock:  80 MHz (default)
; ============================================

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Serial monitor baud rate — must match Serial.begin() in main.cpp
monitor_speed = 115200

; Build flags
;   -DWORKLOAD_ITERATIONS=1000  — configurable iteration count
;   -Wall -Wextra               — enable compiler warnings
build_flags =
    -Wall
    -Wextra
    -DWORKLOAD_ITERATIONS=1000

; Upload settings (auto-detect COM port)
; Uncomment and set if auto-detect fails:
; upload_port = COM3
